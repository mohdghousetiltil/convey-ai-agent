# Question registry — full Section 32 coverage.
#
# answer_strategy values:
#   deterministic   — pull a single fact directly from the FactStore
#   grounded_ai     — send question + doc snippets to AI, require a quote
#   human_review    — always escalate; too legally sensitive to auto-answer
#   policy_default  — client-policy boilerplate; no facts required
#
# value_transform values (deterministic only):
#   direct          — single path, return value as-is
#   negate          — single bool path, return NOT(value)
#   first_present   — walk paths in order, return first non-None value
#   any_true        — bool paths, True if any is True
#   all_false       — bool paths, True only when every fact is False

questions:

  # ===========================================================================
  # Sec. 32 (1) — Rates, Taxes, Charges & Insurance
  # ===========================================================================

  # ---- 1.1 Outgoings (rates rows 1–4) ------------------------------------

  - id: sec32_1.1_outgoing_1_authority
    tab: "Sec. 32 (1)"
    label: "1.1 Outgoing 1 - Authority name"
    fact_paths:
      - rates.council.authority_name
    answer_strategy: deterministic
    value_transform: first_present
    expected_type: string
    description: Council authority name — first outgoing row.

  - id: sec32_1.1_outgoing_1_amount
    tab: "Sec. 32 (1)"
    label: "1.1 Outgoing 1 - Amount"
    fact_paths:
      - rates.council.annual_amount
    answer_strategy: deterministic
    value_transform: first_present
    expected_type: string

  - id: sec32_1.1_outgoing_2_authority
    tab: "Sec. 32 (1)"
    label: "1.1 Outgoing 2 - Authority name"
    fact_paths:
      - rates.water.authority_name
    answer_strategy: deterministic
    value_transform: first_present
    expected_type: string
    description: Water authority — second outgoing row.

  - id: sec32_1.1_outgoing_2_amount
    tab: "Sec. 32 (1)"
    label: "1.1 Outgoing 2 - Amount"
    fact_paths:
      - rates.water.annual_amount
    answer_strategy: deterministic
    value_transform: first_present
    expected_type: string

  - id: sec32_1.1_outgoing_3_authority

    value_transform: first_present
    expected_type: string
    description: |
      Land tax outgoing — only applicable when land tax is payable.
      Authority name is always "State Revenue Office".

  - id: sec32_1.1_outgoing_3_amount
    tab: "Sec. 32 (1)"
    label: "1.1 Outgoing 3 - Amount"
    fact_paths:
      - rates.land_tax.amount
    answer_strategy: deterministic
    value_transform: first_present
    expected_type: string

  # ---- 1.1 Outgoing row 4: Owners Corporation fees ------------------------


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triconvey-agent"
version = "0.0.125"
description = "Structured extraction pipeline for vendor documents, Sec 32 tabs, and VIC title or planning files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "pypdf>=4.2.0",
  "Pillow>=10.3.0",
  "pytesseract>=0.3.10",
  "openai>=1.0.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pywinauto>=0.6.8",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.20",
  "pywebview>=5.1",
  # Database layer
  "SQLAlchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  # Auth
  "passlib[bcrypt]>=1.7.4",
  "python-jose[cryptography]>=3.3.0",
  # Cloud sync client
  "httpx>=0.27.0",
  "tenacity>=8.2.3",
]

[project.scripts]
triconvey-agent = "triconvey_agent.cli:main"
triconvey-desktop = "desktop_app:main"
convey-bootstrap = "triconvey_agent.db.bootstrap:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"triconvey_agent.ui" = ["templates/*.html", "static/*.css", "static/*.js"]
"triconvey_agent.canonical.questions" = ["registry.yaml"]
"triconvey_agent.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".cache/pytest"
addopts = "--basetemp=.cache/pytest/tmp"

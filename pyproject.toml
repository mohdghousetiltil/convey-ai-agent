[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triconvey-agent"
version = "0.1.0"
description = "Structured extraction pipeline for vendor documents, Sec 32 tabs, and VIC title or planning files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "pypdf>=4.2.0",
  "Pillow>=10.3.0",
  "pytesseract>=0.3.10",
  "openai>=1.0.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pywinauto>=0.6.8",
]

[project.scripts]
triconvey-agent = "triconvey_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
